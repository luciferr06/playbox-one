<style>
  :root{
    --bg-night:#1C1410;
    --bg-panel:#241C16;
    --accent-amber:#D4A15A;
    --accent-amber-dim:#8A6A3E88;
    --accent-gold:#C79B5C;
    --accent-gold-dim:#4A3A22;
    --accent-rose:#B06B4E;
    --accent-rose-dim:#4A2E24;
    --accent-sel:#D4A15A;
    --text-cream:#F3E8DA;
    --text-muted:#A6906D;
    --border-soft:#3A2E22;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-night);
    color:var(--text-cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;

  .ticket-wrap{ width:100%; max-width:420px; }
  .stub{
    background:var(--bg-panel);
    border:1px solid var(--border-soft);
    border-radius:18px;
    padding:22px 22px 18px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--accent-amber); margin:0 0 6px;
  }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; line-height:1.1; margin:0 0 10px; }
  .meta{ display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--text-muted); margin-bottom:4px; }
  .meta span b{color:var(--text-cream); font-weight:600;}

  .perforation{
    position:relative; height:24px; margin:14px -22px;
    background-image:radial-gradient(circle at 0 12px, var(--bg-night) 8px, transparent 9px),
                      radial-gradient(circle at 100% 12px, var(--bg-night) 8px, transparent 9px);
  }
  .perforation::after{
    content:""; position:absolute; left:22px; right:22px; top:12px;
    border-top:1px dashed var(--border-soft);
  }

  .show-picker{ margin:14px 0 4px; }
  .picker-label{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin:0 0 6px; }
  .day-tabs, .show-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .day-tabs::-webkit-scrollbar, .show-tabs::-webkit-scrollbar{ display:none; }
  .day-tab, .show-tab{
    flex-shrink:0; padding:8px 12px; border-radius:8px; border:1px solid var(--border-soft);
    background:transparent; color:var(--text-muted); font-family:'Inter',sans-serif; font-size:12px;
    cursor:pointer; white-space:nowrap;
  }
  .day-tab.active, .show-tab.active{
    background:var(--accent-amber); border-color:var(--accent-amber); color:#1C1410; font-weight:700;
  }
  .show-tabs{ margin-top:8px; }

  .counter-row{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; }
  .counter{ font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--text-muted); }
  .counter b{color:var(--accent-amber); font-size:16px;}
  .live-dot{
    display:inline-block; width:7px;height:7px; border-radius:50%;
    background:var(--accent-sel); margin-right:6px; animation:pulse 1.8s infinite; vertical-align:middle;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .screen{
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.3em;
    color:var(--text-muted); background:linear-gradient(180deg, #2A3040, transparent);
    border-radius:50% 50% 0 0 / 100% 100% 0 0; padding:10px 0 16px; margin-bottom:18px;
  }

  .rows{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:6px; }
  .row{ display:flex; gap:8px; }

    display:flex; align-items:center; justify-content:center;

  .seat:hover:not(:disabled){ transform:translateY(-2px); }
  .seat.booked{ background:var(--accent-rose-dim); border-color:var(--accent-rose); color:var(--accent-rose); cursor:not-allowed; }
  .seat.pending{ background:var(--accent-gold-dim); border-color:var(--accent-gold); color:var(--accent-gold); cursor:not-allowed; animation:pulse 1.6s infinite; }
  .seat.selected{ background:var(--accent-sel); border-color:var(--accent-sel); color:#111111; font-weight:700; transform:translateY(-3px); }

  .legend{ display:flex; justify-content:center; gap:14px; font-size:10.5px; color:var(--text-muted); margin:16px 0 4px; flex-wrap:wrap; }

  button.ghost{

  .footer-links{ display:flex; justify-content:center; gap:16px; margin-top:14px; }

  .contact-section{

  .sheet{

  label{

  .price-line{ display:flex; justify-content:space-between; font-size:14px; margin:10px 0 4px; color:var(--text-muted); }
  .price-line b{color:var(--text-cream); font-size:16px;}
  .note{font-size:11px; color:var(--text-muted); margin-top:10px; line-height:1.5;}
  .error{ color:var(--accent-rose); font-size:12px; margin-top:10px; }
  .close-x{ background:none; border:none; color:var(--text-muted); font-size:14px; float:right; cursor:pointer; text-transform:uppercase; letter-spacing:.03em; }

  .qr-box{ text-align:center; background:#F2EDE4; border-radius:10px; padding:14px; margin:14px 0; display:flex; align-items:center; justify-content:center; }

  .upi-app-row{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:14px 0; }
  .upi-app-btn{
    display:flex; flex-direction:column; align-items:center; gap:5px;

  .pay-id-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;

  .success .icon{
    width:52px;height:52px;border-radius:50%; background:var(--accent-amber);
    display:flex;align-items:center;justify-content:center; font-size:24px; margin:0 auto 14px; color:#1C1410;

  .success{text-align:center;}
  .ticket-code{
    font-family:'JetBrains Mono',monospace; letter-spacing:.1em; background:#2A2018;
    border:1px dashed var(--border-soft); border-radius:8px; padding:12px; margin:14px 0; font-size:14px;
    word-break:break-word;
  }
  .spinner{
    width:34px;height:34px; border:3px solid var(--border-soft); border-top-color:var(--accent-amber);
    border-radius:50%; margin:20px auto; animation:spin .8s linear infinite;

  .org-section{ border-bottom:1px dashed var(--border-soft); padding-bottom:16px; margin-bottom:16px; }
  .org-row{ border:1px solid var(--border-soft); border-radius:10px; padding:12px; margin-bottom:10px; }
  .org-row .top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
  .org-row .top b{ color:var(--accent-gold); }
  .org-row .sub{ font-size:12px; color:var(--text-muted); margin-bottom:8px; }
  .org-actions button{
    width:100%; padding:8px; border-radius:7px; border:1px solid var(--accent-rose); font-size:12px;
    cursor:pointer; font-weight:600; background:var(--accent-rose-dim); color:var(--accent-rose);
  }
  .empty-state{ color:var(--text-muted); font-size:13px; text-align:center; padding:12px 0; }
  .ticket-match{
    border:1px solid var(--border-soft); border-radius:10px; padding:12px; margin-bottom:10px;
  }
  .ticket-match .top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
  .ticket-match .top b{ color:var(--accent-gold); }
  .ticket-match .sub{ font-size:12px; color:var(--text-muted); margin-bottom:8px; line-height:1.6; }
</style>

<script>

  apiKey: "AIzaSyAtodPRNkfCvenlYU89vrQveBn8HSyKqMM",
  authDomain: "playbox-booking-b03bb.firebaseapp.com",

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const ROWS = 6;
const PER_ROW = 4;
const TOTAL_SEATS = ROWS * PER_ROW;
const NUM_DAYS = 5;
const NUM_SHOWS_PER_DAY = 3;
let PRICE = 1;
const TAX_RATE = 0.05;
let UPI_ID = 'luciferr.06@ybl';
let UPI_PHONE = '';
const UPI_PAYEE_NAME = 'Playbox';

function blankSeat(){ return { status:'available', name:'', contact:'', email:'', ref:'', time:'' }; }
function seatsArrayToKeyed(arr){
  const obj = {};
  arr.forEach((s, i) => { obj[i+1] = s; });
  return obj;
}
function normalizeSeats(raw){
  let arr = null;
  if(Array.isArray(raw)){
    arr = raw;
  } else if(raw && typeof raw === 'object'){
    arr = Array.from({length: TOTAL_SEATS}, (_, i) => raw[i+1] || raw[String(i+1)] || null);
  }
  if(!arr || arr.length !== TOTAL_SEATS) return Array.from({length: TOTAL_SEATS}, blankSeat);
  return arr.map(s => {
    if(!s || typeof s !== 'object' || !('status' in s) || !['available','pending','booked'].includes(s.status)){
      return blankSeat();
    }
    return s;
  });
}
function toTitleCase(str){
  if(!str) return '';
  return str.trim().toLowerCase().replace(/\b\w/g, ch => ch.toUpperCase());
}
function money(n){ return '₹' + n.toFixed(2).replace(/\.00$/, ''); }
function normalizePhone(p){ return (p || '').replace(/\D/g, '').slice(-10); }
function compressImageToDataUrl(file, maxSize){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- Date / show helpers ---------- */

function dateForOffset(offset){
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d;
}
function dateKey(d){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}
function dayLabel(offset, d){
  if(offset === 0) return 'Today';
  if(offset === 1) return 'Tomorrow';
  return d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
}
function fullDateLabel(d){
  return d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
}
function showKeyFor(dayOffset, showIndex){
  return dateKey(dateForOffset(dayOffset)) + '_' + showIndex;
}

let selectedDayOffset = 0;
let selectedShowIndex = 0;
let seats = Array.from({length: TOTAL_SEATS}, blankSeat);
let selectedSeats = new Set();
let eventInfo = {
  movie:'', showTimes:['10:00 AM','2:00 PM','6:00 PM'],
  contactEmail:'luciferr.06@icloud.com', instagram:'@playbox.one',
  price:1, upiId:'luciferr.06@ybl', upiPhone:'', qrImageUrl:''
};

const rowsEl = document.getElementById('rows');
const bookBtn = document.getElementById('bookBtn');
const availCountEl = document.getElementById('availCount');
const lastUpdatedEl = document.getElementById('lastUpdated');
const modalRoot = document.getElementById('modalRoot');
const selectionSummaryEl = document.getElementById('selectionSummary');
const dayTabsEl = document.getElementById('dayTabs');
const showTabsEl = document.getElementById('showTabs');

function renderDayShowTabs(){
  dayTabsEl.innerHTML = '';
  for(let i=0; i<NUM_DAYS; i++){
    const d = dateForOffset(i);
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === selectedDayOffset ? ' active' : '');
    btn.textContent = dayLabel(i, d);
    btn.addEventListener('click', () => {
      if(selectedDayOffset === i) return;
      selectedDayOffset = i;
      switchShow();
    });
    dayTabsEl.appendChild(btn);
  }
  showTabsEl.innerHTML = '';
  for(let i=0; i<NUM_SHOWS_PER_DAY; i++){
    const btn = document.createElement('button');
    btn.className = 'show-tab' + (i === selectedShowIndex ? ' active' : '');
    btn.textContent = eventInfo.showTimes[i] || ('Show ' + (i+1));
    btn.addEventListener('click', () => {
      if(selectedShowIndex === i) return;
      selectedShowIndex = i;
      switchShow();
    });
    showTabsEl.appendChild(btn);
  }
}

function renderEventDate(){
  const d = dateForOffset(selectedDayOffset);
  document.getElementById('eventDate').textContent = fullDateLabel(d);
}

function renderEventInfo(){
  document.getElementById('movieSpan').textContent = 'Movie: ' + (eventInfo.movie ? eventInfo.movie : '—');
  document.getElementById('showTimingSpan').textContent = 'Show Timing: ' + (eventInfo.showTimes[selectedShowIndex] || '—');
  document.getElementById('priceDisplay').textContent = '₹' + PRICE;
  renderEventDate();
  renderDayShowTabs();

  const emailIcon = document.getElementById('contactEmailIcon');
  if(eventInfo.contactEmail){
    emailIcon.href = 'mailto:' + eventInfo.contactEmail;
    emailIcon.title = eventInfo.contactEmail;
    emailIcon.classList.remove('disabled');
  } else {
    emailIcon.href = '#'; emailIcon.title = 'Email'; emailIcon.classList.add('disabled');
  }

  const instaIcon = document.getElementById('contactInstaIcon');
  if(eventInfo.instagram){
    const handle = eventInfo.instagram.replace(/^@/, '');
    instaIcon.href = 'https://instagram.com/' + handle;
    instaIcon.title = eventInfo.instagram;
    instaIcon.classList.remove('disabled');
  } else {
    instaIcon.href = '#'; instaIcon.title = 'Instagram'; instaIcon.classList.add('disabled');
  }
}

function renderSeats(){
  rowsEl.innerHTML = '';
  for(let r=0; r<ROWS; r++){
    const rowDiv = document.createElement('div');
    rowDiv.className = 'row';
    for(let c=0; c<PER_ROW; c++){
      const idx = r*PER_ROW + c;
      const seatNum = idx + 1;
      const s = seats[idx];
      const btn = document.createElement('button');
      btn.className = 'seat';
      btn.textContent = seatNum;
      btn.setAttribute('aria-label', 'Seat ' + seatNum + ' — ' + s.status);

      const offset = c - (PER_ROW-1)/2;
      const rotate = offset * 1.6;
      const lift = Math.abs(offset) * 2.5;
      btn.style.transform = `rotate(${rotate}deg) translateY(${lift}px)`;

      if(s.status === 'booked'){ btn.classList.add('booked'); btn.disabled = true; }
      else if(s.status === 'pending'){ btn.classList.add('pending'); btn.disabled = true; }
      if(selectedSeats.has(idx)){ btn.classList.add('selected'); }

      btn.addEventListener('click', () => {
        if(s.status !== 'available') return;
        if(selectedSeats.has(idx)) selectedSeats.delete(idx);
        else selectedSeats.add(idx);
        renderSeats();
        updateCta();
      });
      rowDiv.appendChild(btn);
    }
    rowsEl.appendChild(rowDiv);
  }
}

function updateCta(){
  const availCount = seats.filter(s => s.status === 'available').length;
  availCountEl.textContent = availCount;

  if(selectedSeats.size > 0){
    const subtotal = selectedSeats.size * PRICE;
    const tax = subtotal * TAX_RATE;
    const total = subtotal + tax;
    const seatList = [...selectedSeats].map(i => i+1).sort((a,b)=>a-b).join(', ');
    selectionSummaryEl.innerHTML = `Seat${selectedSeats.size>1?'s':''} ${seatList} · <b>${money(total)}</b> incl. tax`;
    bookBtn.disabled = false;
    bookBtn.textContent = 'Book Now';
  } else {
    selectionSummaryEl.innerHTML = '';
    bookBtn.disabled = availCount === 0;
    bookBtn.textContent = availCount === 0 ? 'Sold out' : 'Select Seat';
  }
}

function applyIncomingEventInfo(stored){
  if(stored){
    eventInfo = {
      movie: stored.movie || eventInfo.movie,
      showTimes: (Array.isArray(stored.showTimes) && stored.showTimes.length === 3) ? stored.showTimes : eventInfo.showTimes,
      contactEmail: stored.contactEmail || eventInfo.contactEmail,
      instagram: stored.instagram || eventInfo.instagram,
      price: (stored.price !== undefined && stored.price !== null && stored.price !== '') ? Number(stored.price) : eventInfo.price,
      upiId: stored.upiId || eventInfo.upiId,
      upiPhone: stored.upiPhone !== undefined ? stored.upiPhone : eventInfo.upiPhone,
      qrImageUrl: stored.qrImageUrl !== undefined ? stored.qrImageUrl : eventInfo.qrImageUrl
    };
  }
  PRICE = eventInfo.price;
  UPI_ID = eventInfo.upiId;
  UPI_PHONE = eventInfo.upiPhone;
  renderEventInfo();
  updateCta();
}

function initEventInfoListener(){
  db.ref('event-info').on('value', (snapshot) => {
    applyIncomingEventInfo(snapshot.exists() ? snapshot.val() : null);
  }, (err) => {
    console.error('event-info listener error', err);
  });
}

function applyIncomingSeats(raw){
  seats = normalizeSeats(raw);
  selectedSeats.forEach(idx => {
    if(seats[idx].status !== 'available') selectedSeats.delete(idx);
  });
  renderSeats();
  updateCta();
  lastUpdatedEl.textContent = 'updated ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

let currentSeatsRef = null;
function attachSeatsListener(showKey){
  if(currentSeatsRef) currentSeatsRef.off();
  lastUpdatedEl.textContent = 'syncing…';
  currentSeatsRef = db.ref('seats-status/' + showKey);
  currentSeatsRef.on('value', (snapshot) => {
    if(snapshot.exists()){
      applyIncomingSeats(snapshot.val());
    } else {
      const blank = Array.from({length: TOTAL_SEATS}, blankSeat);
      currentSeatsRef.set(seatsArrayToKeyed(blank));
      applyIncomingSeats(blank);
    }
  }, (err) => {
    console.error('seats listener error', err);
  });
}

function switchShow(){
  selectedSeats.clear();
  renderEventInfo();
  attachSeatsListener(showKeyFor(selectedDayOffset, selectedShowIndex));
}

async function getFreshSeats(showKey){
  const snapshot = await db.ref('seats-status/' + showKey).once('value');
  return normalizeSeats(snapshot.exists() ? snapshot.val() : null);
}

async function submitBooking(name, contact, email, ref){
  const seatNums = [...selectedSeats].map(i => i+1).sort((a,b)=>a-b);
  const showKey = showKeyFor(selectedDayOffset, selectedShowIndex);
  const dateLabel = fullDateLabel(dateForOffset(selectedDayOffset));
  const timeLabel = eventInfo.showTimes[selectedShowIndex];
  const movie = eventInfo.movie;

  modalRoot.innerHTML = `
    <div class="overlay">
      <div class="sheet" style="text-align:center;">
        <h2>Confirming…</h2>
        <div class="spinner"></div>
        <p class="sub">Locking in your seat(s).</p>
      </div>
    </div>
  `;
  await new Promise(r => setTimeout(r, 800));

  try{
    const allSnap = await db.ref('seats-status').once('value');
    const allShows = allSnap.exists() ? allSnap.val() : {};
    const refNormalized = ref.trim().toLowerCase();
    let refAlreadyUsed = false;
    Object.values(allShows).forEach(showSeats => {
      Object.values(showSeats || {}).forEach(s => {
        if(s && s.status === 'booked' && s.ref && s.ref.trim().toLowerCase() === refNormalized){
          refAlreadyUsed = true;
        }
      });
    });
    if(refAlreadyUsed){
      showFailure('This UPI transaction reference has already been used for another booking. Double-check the reference number from your payment app, or contact the organizer if you believe this is a mistake.');
      return;
    }

    const current = await getFreshSeats(showKey);
    const taken = [...selectedSeats].filter(idx => current[idx].status !== 'available');
    if(taken.length > 0){
      showFailure('Seat(s) ' + taken.map(i=>i+1).join(', ') + ' were just taken by someone else. Pick different seats.');
      seats = current; selectedSeats.clear(); renderSeats(); updateCta();
      return;
    }
    const time = new Date().toISOString();
    const updates = {};
    const ticketCode = 'PB-' + seatNums.join('-') + '-' + Math.random().toString(36).slice(2,6).toUpperCase();
    selectedSeats.forEach(idx => {
      const seatData = { status:'booked', name, contact, email, ref, time, ticketCode, movie, dateLabel, timeLabel, showKey, seatNum: idx+1 };
      current[idx] = seatData;
      updates[(idx+1)] = seatData;
    });
    await db.ref('seats-status/' + showKey).update(updates);
    seats = current;
    showBookedSuccess(name, seatNums, ticketCode, dateLabel, timeLabel, movie);
    selectedSeats.clear();
    renderSeats(); updateCta();
  }catch(e){
    console.error(e);
    showFailure('Something went wrong confirming your seat(s). Please try again.');
  }
}

function openViewTicketSheet(){
  modalRoot.innerHTML = `

        </div>
        <div id="lookupResults"></div>
      </div>
    </div>
  `;
  document.getElementById('closeX').onclick = closeSheet;
  const phoneInput = document.getElementById('lookupPhone');
  const doLookup = async () => {
    const phone = normalizePhone(phoneInput.value);
    const errEl = document.getElementById('lookupError');
    const resultsEl = document.getElementById('lookupResults');
    if(phone.length !== 10){
      errEl.textContent = 'Enter a valid 10-digit phone number.';
      errEl.style.display = 'block';
      resultsEl.innerHTML = '';
      return;
    }
    errEl.style.display = 'none';
    resultsEl.innerHTML = '<div class="spinner"></div>';
    try{
      const snap = await db.ref('seats-status').once('value');
      const allShows = snap.exists() ? snap.val() : {};
      const matches = [];
      Object.keys(allShows).forEach(showKey => {
        const showSeats = allShows[showKey] || {};
        Object.keys(showSeats).forEach(seatKey => {
          const s = showSeats[seatKey];
          if(s && s.status === 'booked' && normalizePhone(s.contact) === phone){
            matches.push(s);
          }
        });
      });
      if(matches.length === 0){
        resultsEl.innerHTML = '<p class="empty-state">No bookings found for that number.</p>';
        return;
      }
      matches.sort((a,b) => (a.showKey||'').localeCompare(b.showKey||''));
      resultsEl.innerHTML = matches.map((m, i) => `
        <div class="ticket-match">
          <div class="top"><b>Seat ${m.seatNum}</b><span>${m.dateLabel || ''}</span></div>
          <div class="sub">${m.movie ? m.movie + '<br>' : ''}${m.timeLabel || ''}<br>Code: ${m.ticketCode || '—'}</div>
          <button class="primary" data-idx="${i}" style="margin-top:0;">Download Ticket (PDF)</button>
        </div>
      `).join('');
      resultsEl.querySelectorAll('button[data-idx]').forEach(btn => {
        btn.addEventListener('click', () => downloadTicketImage(matches[parseInt(btn.dataset.idx,10)]));
      });
    }catch(e){
      console.error(e);
      resultsEl.innerHTML = '<p class="empty-state">Something went wrong looking that up. Try again.</p>';
    }
  };
  document.getElementById('lookupBtn').onclick = doLookup;
  phoneInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') doLookup(); });
  phoneInput.focus();
}

function downloadTicketImage(match){
  const { jsPDF } = window.jspdf;
  const W = 220, H = 320;
  const doc = new jsPDF({ unit:'pt', format:[W, H] });

  doc.setFillColor(13,13,13);
  doc.rect(0, 0, W, H, 'F');

  doc.setTextColor(245,245,245);
  doc.setFont('courier', 'bold');
  doc.setFontSize(15);
  doc.text('PLAYBOX', W/2, 30, { align:'center' });

  doc.setDrawColor(46,46,46);
  doc.setLineDashPattern([2,2], 0);
  doc.line(20, 42, W-20, 42);

  const rows = [
    ['Movie', match.movie || '—'],
    ['Date', match.dateLabel || '—'],
    ['Time', match.timeLabel || '—'],
    ['Seat', String(match.seatNum)],
    ['Name', toTitleCase(match.name) || '—']
  ];
  let y = 64;
  doc.setFont('courier', 'normal');
  doc.setFontSize(10);
  rows.forEach(([label, val]) => {
    doc.setTextColor(138,138,138);
    doc.text(label, 20, y);
    doc.setTextColor(245,245,245);
    doc.text(String(val), W-20, y, { align:'right' });
    y += 24;
  });

  doc.setLineDashPattern([2,2], 0);
  doc.line(20, y+2, W-20, y+2);

  doc.setTextColor(207,207,207);
  doc.setFontSize(9);
  doc.text('Code: ' + (match.ticketCode || '—'), W/2, y+22, { align:'center' });

  doc.save('playbox-ticket-seat' + match.seatNum + '.pdf');
}

        <p class="sub">${booked.length} of ${TOTAL_SEATS} seats booked (this show) · ${money(booked.length * PRICE * (1+TAX_RATE))} collected incl. tax</p>
        <div id="orgRows">${rowsHtml}</div>
        <button class="ghost" id="resetAllBtn" style="margin-top:10px; border-color:var(--accent-rose); color:var(--accent-rose);">Reset ALL Seats to AVAILABLE (this show)</button>
        <button class="ghost" id="signOutBtn" style="margin-top:8px;">Sign Out</button>
        <p class="note">Note: buyer names, contact, email and payment refs are visible here, so treat this link as organizer-only — don't post it publicly.</p>
      </div>
    </div>
  `;
  document.getElementById('closeX').onclick = closeSheet;
  document.getElementById('signOutBtn').onclick = async () => {
    await auth.signOut();
    closeSheet();
  };
  document.getElementById('saveInfoBtn').onclick = async () => {
    const saveBtn = document.getElementById('saveInfoBtn');
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    const movie = document.getElementById('movieInput').value.trim();
    const showTimes = [
      document.getElementById('show1Input').value.trim() || eventInfo.showTimes[0],
      document.getElementById('show2Input').value.trim() || eventInfo.showTimes[1],
      document.getElementById('show3Input').value.trim() || eventInfo.showTimes[2]
    ];
    const contactEmail = document.getElementById('contactEmailInput').value.trim();
    const instagram = document.getElementById('instagramInput').value.trim();
    const priceVal = parseFloat(document.getElementById('priceInput').value);
    const upiIdVal = document.getElementById('upiIdInput').value.trim();
    const upiPhone = document.getElementById('upiPhoneInput').value.trim();
    const price = (!isNaN(priceVal) && priceVal >= 0) ? priceVal : PRICE;
    const upiId = upiIdVal || UPI_ID;
    let qrImageUrl = eventInfo.qrImageUrl;
    const qrFile = document.getElementById('qrUploadInput').files[0];
    if(qrFile){
      try{ qrImageUrl = await compressImageToDataUrl(qrFile, 300); }
      catch(e){ console.error('QR image processing failed', e); }
    }
    eventInfo = { movie, showTimes, contactEmail, instagram, price, upiId, upiPhone, qrImageUrl };
    PRICE = price;
    UPI_ID = upiId;
    UPI_PHONE = upiPhone;
    await db.ref('event-info').set(eventInfo);
    renderEventInfo();
    updateCta();
    openOrgPanel();
  };
  document.getElementById('resetAllBtn').onclick = async () => {
    if(!confirm('Reset all ' + TOTAL_SEATS + ' seats to available for this show only? This clears every booking for ' + fullDateLabel(dateForOffset(selectedDayOffset)) + ' · ' + eventInfo.showTimes[selectedShowIndex] + '.')) return;
    const fresh = Array.from({length: TOTAL_SEATS}, blankSeat);
    await db.ref('seats-status/' + showKey).set(seatsArrayToKeyed(fresh));
    seats = fresh;
    renderSeats(); updateCta();
    openOrgPanel();
  };
  document.querySelectorAll('#orgRows button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const seatNum = parseInt(btn.dataset.seat, 10);
      await releaseSeat(showKey, seatNum);
      openOrgPanel();
    });
  });
}

async function releaseSeat(showKey, seatNum){
  try{
    await db.ref('seats-status/' + showKey + '/' + seatNum).set(blankSeat());
  }catch(e){ console.error(e); }
}
</script>

</body>
</html>
